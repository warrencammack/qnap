services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Australia/Sydney
      - UMASK=002                          # Group-writable; all services share PGID=100 so cross-service file access works
      - SKIP_CHOWN=true                    # Skip ownership change operations
    volumes:
      - /share/Container/containerapp/sabnzbd/config:/config # Config files
      - /share/Public/Incomplete:/incomplete-downloads # Downloads location with shared mount flag :shared 
      - /share/Public/Complete:/downloads/complete        # Completed downloads location with shared mount flag :shared
    ports:
      - 8181:8080 # was 8080:8080
    restart: unless-stopped
    # privileged mode removed - not required by linuxserver.io images; PUID/PGID + SKIP_CHOWN handle permissions