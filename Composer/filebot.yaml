services:
  filebot:
    image: rednoah/filebot:latest
    container_name: filebot
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Australia/Sydney
      - UMASK=000                          # Set permissive umask to help with permission issues
      - SKIP_CHOWN=true                    # Skip ownership change operations
    volumes:
      - /share/Container/containerapp/filebot:/config # Config files
      - /share/Multimedia/movies:/movies # Movies library
      - /share/Multimedia/TV:/tv # TV series library
      - /share/Public/Complete:/downloads/complete # Standard downloads location
    ports:
      - 7676:7676 # FileBot web interface port
    restart: unless-stopped
    privileged: true # Running in privileged mode
    networks:
      - default
      - shared_network
networks:
  default:
    driver: bridge
  shared_network:
    name: app_network