services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: qnap
    network_mode: host
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:nas --ssh
    volumes:
      - /share/Container/containerapp/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
